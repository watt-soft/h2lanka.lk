  <!-- Typography -->
  <text x="82" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#083870" letter-spacing="-0.5">H2 Lanka</text>
  <text x="83" y="64" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748B" letter-spacing="0.5">(Pvt) Ltd</text>
