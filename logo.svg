    <path d="M 44 28 L 58 28 L 58 78 L 44 78 Z" fill="url(#hBlueGrad)" />
    <path d="M 26 47 L 44 43 L 44 58 L 26 62 Z" fill="url(#hBlueGrad)" />

    <!-- Molecule connection in the crossbar -->
    <line x1="22" y1="54" x2="33" y2="57" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" />
    <line x1="33" y1="57" x2="47" y2="50" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" />
    <circle cx="22" cy="54" r="4.2" fill="#FFFFFF" />
    <circle cx="33" cy="57" r="3.2" fill="#FFFFFF" />
    <circle cx="47" cy="50" r="3.8" fill="#FFFFFF" />

    <!-- Numeral '2' -->
    <path d="M 60 40 C 60 30, 70 25, 80 25 C 91 25, 97 32, 97 41 C 97 50, 89 58, 77 66 L 60 78 L 98 78 L 98 68 L 75 68 L 85 60 C 96 50, 100 42, 100 37 C 100 24, 90 17, 78 17 C 66 17, 57 25, 56 36 Z" fill="url(#num2Grad)" />

